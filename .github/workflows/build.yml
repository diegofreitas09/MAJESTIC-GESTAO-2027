name: Majestic - validação de build e segurança

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependências
        run: npm install --no-fund
      - name: Auditoria de dependências
        run: npm audit --audit-level=high
      - name: Build Executivo e Atendimento
        run: npm run build
